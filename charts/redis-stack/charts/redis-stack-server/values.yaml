name: redis-stack-server
redis_stack_server:
  # Official open-source Redis 8. Search (with the SVS-VAMANA vector index), JSON,
  # Bloom and TimeSeries are built in; no separate Redis Stack image is needed.
  image: "redis"
  tag: "8.10.3"
  port: 6379
  replicas: 1
  storage_class: ""
  storage: 1Gi
  affinity: {}
  # The redis image switches to its `redis` user only when started as root; the
  # container drops every capability, so start it as that user directly.
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  auth:
    # Redis requires a password (requirepass) by default. The password is stored
    # in the `<name>-credentials` Secret and passed as `--requirepass`.
    # Required: set via --set or a custom values file. There is no default.
    enabled: true
    password: ""
  service:
    # ClusterIP keeps Redis reachable only from inside the cluster.
    # Do NOT use NodePort/LoadBalancer: that publishes Redis on every node IP
    # in the 30000-32767 range, where it is reachable by anything that can
    # route to a node.
    type: ClusterIP
  # Restrict ingress to the namespaces/pods that actually need Redis.
  # With an empty `allowedNamespaces`, all in-cluster pods may connect (the
  # pre-existing behaviour); listing namespaces limits it to those only.
  networkPolicy:
    enabled: true
    allowedNamespaces: []

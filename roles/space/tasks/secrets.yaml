# =============================================================================
# SPACE — the Secrets the charts reference and do not create
# (infra/space/cluster/README.md, Secrets). Generated material is created once
# and never rotated by a re-run; derived Secrets are reconciled every run.
# =============================================================================

- name: "space | secrets | Read existing Secrets"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ space_namespace }}"
  register: _space_secrets
  no_log: true

- name: "space | secrets | Record existing Secret names"
  ansible.builtin.set_fact:
    _space_have: "{{ _space_secrets.resources | map(attribute='metadata.name') | list }}"

# ── Generated once ───────────────────────────────────────────────────────────

- name: "space | secrets | Create the internal tokens"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: space-internal, namespace: "{{ space_namespace }}"}
      type: Opaque
      stringData:
        SPACE_INTERNAL_TOKEN: "{{ lookup('password', '/dev/null length=48 chars=hexdigits') }}"
        SPACE_INTERNAL_CONTROL_TOKEN: "{{ lookup('password', '/dev/null length=48 chars=hexdigits') }}"
        SPACE_PUBLIC_CURSOR_SECRET: "{{ lookup('password', '/dev/null length=48 chars=hexdigits') }}"
        ecw-credential-key: "{{ lookup('password', '/dev/null length=48 chars=hexdigits') }}"
  when: "'space-internal' not in _space_have"
  no_log: true

- name: "space | secrets | Create the managed database role passwords"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: space-db-roles, namespace: "{{ space_namespace }}"}
      type: Opaque
      stringData:
        SPACE_DB_BOOTSTRAP_SUPERADMIN_PASSWORD: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        SPACE_DB_BOOTSTRAP_USER_PASSWORD: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        SPACE_DB_BOOTSTRAP_RO_PASSWORD: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        SPACE_DB_BOOTSTRAP_MIGRATOR_PASSWORD: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        SPACE_DB_BOOTSTRAP_CREDS_PASSWORD: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
  when: "'space-db-roles' not in _space_have"
  no_log: true

- name: "space | secrets | Create the key broker token"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: space-key-broker-token, namespace: "{{ space_namespace }}"}
      type: Opaque
      stringData:
        token: "{{ lookup('password', '/dev/null length=48 chars=hexdigits') }}"
  when: "'space-key-broker-token' not in _space_have"
  no_log: true

- name: "space | secrets | Create the route-token signing key"
  when: "'space-route-signing' not in _space_have"
  block:
    - name: "space | secrets | Generate an ed25519 route signing key"
      ansible.builtin.shell: |
        set -euo pipefail
        key=$(openssl genpkey -algorithm ed25519)
        pub=$(printf '%s\n' "$key" | openssl pkey -pubout)
        jq -n --arg key "$key" --arg pub "$pub" '{key: $key, pub: ($pub + "\n")}'
      args:
        executable: /bin/bash
      register: _space_route_key
      changed_when: true
      no_log: true

    - name: "space | secrets | Store the route signing and verification Secrets"
      vars:
        _k: "{{ _space_route_key.stdout | from_json }}"
        _issuer: "{{ space_cluster_id }}-route-authority"
        _key_id: "{{ space_cluster_id }}-route-1"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: "{{ item.name }}", namespace: "{{ space_namespace }}"}
          type: Opaque
          stringData: "{{ item.data }}"
      loop:
        - name: space-route-signing
          data:
            signing-key.pem: "{{ _k.key }}"
            SPACE_API_ROUTE_ED25519_SIGNING_KEY_ID: "{{ _key_id }}"
            SPACE_API_ROUTE_ED25519_ISSUER: "{{ _issuer }}"
        - name: space-route-verification
          data:
            verification-bundle.json: >-
              {{ {'generation': 1, 'issuer': _issuer,
                  'keys': [{'key_id': _key_id, 'public_key_pem': _k.pub}]} | to_json }}
      loop_control:
        label: "{{ item.name }}"
      no_log: true

# The seed build generated this key pair and baked the public key into the seed
- name: "space | secrets | Store the sandbox SSH key pair"
  vars:
    _ssh_dir: "{{ space_build_dir }}/home/.space-devbox/kind/ssh"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: space-sandbox-ssh, namespace: "{{ space_namespace }}"}
      type: Opaque
      stringData:
        sandbox_ed25519: "{{ lookup('file', _ssh_dir ~ '/sandbox_ed25519') }}\n"
        sandbox_ed25519.pub: "{{ lookup('file', _ssh_dir ~ '/sandbox_ed25519.pub') }}\n"
  no_log: true

# ── Derived from the platform ────────────────────────────────────────────────

- name: "space | secrets | Read the platform database credentials"
  kubernetes.core.k8s_info:
    kind: Secret
    name: space-db-secret
    namespace: "{{ space_namespace }}"
  register: _space_db_secret
  no_log: true

- name: "space | secrets | Provision the SPACE database (platform installed before SPACE was enabled)"
  ansible.builtin.include_role:
    name: postgresql
    tasks_from: consumer.yaml
  vars:
    postgresql_consumer: space
  when: _space_db_secret.resources | length == 0

- name: "space | secrets | Re-read the platform database credentials"
  kubernetes.core.k8s_info:
    kind: Secret
    name: space-db-secret
    namespace: "{{ space_namespace }}"
  register: _space_db_secret
  no_log: true
  when: _space_db_secret.resources | length == 0

- name: "space | secrets | Store the SPACE connection string"
  vars:
    _d: "{{ _space_db_secret.resources[0].data }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: space-postgres, namespace: "{{ space_namespace }}"}
      type: Opaque
      stringData:
        POSTGRES_CONNECTION_STRING: >-
          postgres://{{ _d.username | b64decode | urlencode }}:{{ _d.password | b64decode | urlencode }}@{{
          _d.host | b64decode }}:{{ _d.port | b64decode }}/{{ _d.database | b64decode }}?sslmode=prefer
  no_log: true

- name: "space | secrets | Read the object store credentials"
  kubernetes.core.k8s_info:
    kind: Secret
    name: "{{ object_store_credentials_secret | default('object-store-credentials') }}"
    namespace: "{{ object_store_namespace | default('monitoring') }}"
  register: _space_os_secret
  no_log: true

- name: "space | secrets | Fail without SPACE object store credentials"
  ansible.builtin.fail:
    msg: >-
      The object store credentials Secret has no spaceAccessKey. Re-run the platform
      install (install platform, or install seaweedfs) so the object store registers
      the SPACE buckets and keys, then re-run.
  when: (_space_os_secret.resources[0].data | default({})).spaceAccessKey is not defined

- name: "space | secrets | Store the SPACE object store credentials"
  vars:
    _d: "{{ _space_os_secret.resources[0].data }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: space-object-store, namespace: "{{ space_namespace }}"}
      type: Opaque
      stringData:
        SPACE_OBJECT_STORE_STATIC_ACCESS_KEY_ID: "{{ _d.spaceAccessKey | b64decode }}"
        SPACE_OBJECT_STORE_STATIC_SECRET_ACCESS_KEY: "{{ _d.spaceSecretKey | b64decode }}"
  no_log: true

- name: "space | secrets | Record the object store endpoint"
  ansible.builtin.set_fact:
    space_object_store_endpoint: "{{ _space_os_secret.resources[0].data.endpoint | b64decode }}"

# ── Internal TLS (cert-manager; names and SANs as infra/space/kind/scripts/internal-rpc-tls.sh) ──

- name: "space | secrets | Issue the internal CA and the TLS identities"
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
  loop: "{{ lookup('template', 'certificates.yaml.j2') | from_yaml_all | select | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"

- name: "space | secrets | Wait for the certificates"
  ansible.builtin.command: >-
    kubectl -n {{ space_namespace }} wait certificate
    -l app.kubernetes.io/part-of=space --for=condition=Ready --timeout=180s
  changed_when: false

- name: "space | secrets | Read the issued CA and credential-manager certificate"
  kubernetes.core.k8s_info:
    kind: Secret
    name: "{{ item }}"
    namespace: "{{ space_namespace }}"
  loop: [space-internal-rpc-ca-signing, space-credmgr-authority-tls]
  register: _space_issued
  no_log: true

# Trust bundles hold the certificates alone, never a key
- name: "space | secrets | Store the trust bundles"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: "{{ item.name }}", namespace: "{{ space_namespace }}"}
      type: Opaque
      data:
        ca.crt: "{{ item.ca }}"
  loop:
    - {name: space-internal-rpc-ca, ca: "{{ _space_issued.results[0].resources[0].data['ca.crt'] }}"}
    - {name: space-key-broker-ca, ca: "{{ _space_issued.results[0].resources[0].data['ca.crt'] }}"}
    - {name: space-credmgr-authority-trust, ca: "{{ _space_issued.results[1].resources[0].data['tls.crt'] }}"}
  loop_control:
    label: "{{ item.name }}"
  no_log: true

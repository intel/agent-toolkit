# =============================================================================
# SPACE — build from source and deliver to the nodes
# Upstream publishes no images, so space_rev is built with BuildKit straight into
# containerd (namespace k8s.io) on the first SPACE worker. Cluster nodes run no
# Docker, so upstream's build scripts get a docker shim (buildctl + nerdctl).
# Other workers import an archive. Each artifact is built once per tag.
# =============================================================================

- name: "space | build | Check out SPACE {{ space_rev }} (charts and install scripts)"
  ansible.builtin.git:
    repo: "{{ space_repo_url }}"
    dest: "{{ space_src_dir }}"
    version: "{{ space_rev }}"
    force: true
  register: _space_src
  until: _space_src is succeeded
  retries: 3
  delay: 15

- name: "space | build | Get the SPACE nodes"
  kubernetes.core.k8s_info:
    kind: Node
    label_selectors:
      - "{{ space_node_label_key }}={{ space_node_label_value }}"
  register: _space_nodes

# Node names may differ from inventory names; match either, as kata_containers does
- name: "space | build | Collect SPACE worker node names"
  vars:
    _labels: "{{ item.metadata.labels | default({}) }}"
  ansible.builtin.set_fact:
    _space_worker_names: >-
      {{ (_space_worker_names | default([]))
         + [item.metadata.name, _labels['kubernetes.io/hostname'] | default(item.metadata.name)] }}
  loop: "{{ _space_nodes.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"

# A single-node install names its one host localhost in the inventory
- name: "space | build | Map SPACE workers to inventory hosts"
  vars:
    _inventory: "{{ (groups['kube_control_plane'] | default([])) | union(groups['kube_node'] | default([])) }}"
    _matched: "{{ _inventory | select('in', _space_worker_names | default([])) | list }}"
  ansible.builtin.set_fact:
    _space_worker_hosts: >-
      {{ _matched if _matched | length > 0
         else (_inventory if _inventory | length == 1 and _space_nodes.resources | length == 1 else []) }}

- name: "space | build | Fail without a reachable SPACE worker"
  ansible.builtin.fail:
    msg: >-
      No inventory host matches the SPACE workers
      ({{ _space_nodes.resources | map(attribute='metadata.name') | join(', ') }}).
      Name the inventory hosts after the Kubernetes nodes, then re-run.
  when: _space_worker_hosts | length == 0

- name: "space | build | Pick the build host"
  ansible.builtin.set_fact:
    space_build_host: "{{ _space_worker_hosts | first }}"
    _space_build_remote: "{{ (_space_worker_hosts | first) != inventory_hostname }}"

- name: "space | build | Build on {{ space_build_host }}"
  ansible.builtin.include_tasks: build_host.yaml

- name: "space | build | Fetch the build from {{ space_build_host }}"
  ansible.builtin.fetch:
    src: "{{ item }}"
    dest: "{{ item }}"
    flat: true
  loop: >-
    {{ [space_build_dir ~ '/containerd-shim-space-v2-' ~ space_image_tag]
       + ([space_build_dir ~ '/images-' ~ space_image_tag ~ '.tar'] if _space_worker_hosts | length > 1 else []) }}
  become: true
  delegate_to: "{{ space_build_host }}"
  when: _space_build_remote | bool

- name: "space | build | Deliver to each SPACE worker"
  ansible.builtin.include_tasks: deliver.yaml
  loop: "{{ _space_worker_hosts }}"
  loop_control:
    loop_var: space_host

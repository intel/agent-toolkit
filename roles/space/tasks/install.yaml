# =============================================================================
# SPACE — Install (evaluation)
# Hosts are prepared by enterprise-ai-solutions' space_node (infrastructure
# layer). This role builds SPACE at space_rev, supplies the Secrets and TLS the
# upstream cluster install needs, and runs infra/space/cluster/install.sh.
# =============================================================================

- name: "space | Check the space RuntimeClass and SPACE nodes"
  kubernetes.core.k8s_info:
    api_version: node.k8s.io/v1
    kind: RuntimeClass
    name: space
  register: _space_rc

- name: "space | Check SPACE worker nodes"
  kubernetes.core.k8s_info:
    kind: Node
    label_selectors:
      - "{{ space_node_label_key }}={{ space_node_label_value }}"
  register: _space_workers

- name: "space | Fail when the nodes are not prepared"
  ansible.builtin.fail:
    msg: >-
      SPACE needs nodes prepared by the space_node component (infrastructure layer):
      {{ 'RuntimeClass space is missing' if _space_rc.resources | length == 0
         else 'no node is labelled ' ~ space_node_label_key ~ '=' ~ space_node_label_value }}.
      Run ./es_auto_installer.sh install space_node (it runs when space_enabled: true
      is set in config.agent-toolkit.yaml), then re-run.
  when: _space_rc.resources | length == 0 or _space_workers.resources | length == 0

- name: "space | Build and deliver SPACE {{ space_rev[:12] }}"
  ansible.builtin.include_tasks: build.yaml

# ── Namespaces and mesh ──────────────────────────────────────────────────────
# The control plane joins the ambient mesh to reach Postgres and the object
# store; PERMISSIVE admits the host-network node services and the sandboxes,
# which stay outside it. Sandbox pods run in their own unlabelled namespace.

- name: "space | Create namespaces"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item.name }}"
        labels: "{{ item.labels }}"
  loop:
    - name: "{{ space_namespace }}"
      labels: "{{ {'istio.io/dataplane-mode': 'ambient'} if istio_enabled | default(false) | bool else {} }}"
    - {name: "{{ space_sandbox_namespace }}", labels: {}}
    - {name: space-observability, labels: {}}
  loop_control:
    label: "{{ item.name }}"

- name: "space | Admit callers from outside the mesh"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: security.istio.io/v1
      kind: PeerAuthentication
      metadata: "{{ item.metadata }}"
      spec: "{{ item.spec }}"
  loop:
    - metadata: {name: default, namespace: "{{ space_namespace }}"}
      spec: {mtls: {mode: PERMISSIVE}}
    # Node services (host network) read and write sandbox templates and snapshots
    - metadata: {name: space-node-s3, namespace: "{{ object_store_namespace | default('monitoring') }}"}
      spec:
        selector:
          matchLabels: {app.kubernetes.io/component: s3}
        mtls: {mode: STRICT}
        portLevelMtls: "{{ {(seaweedfs_s3_port | default(8333)) | string: {'mode': 'PERMISSIVE'}} }}"
  loop_control:
    label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
  when: istio_enabled | default(false) | bool

- name: "space | Secrets and TLS"
  ansible.builtin.include_tasks: secrets.yaml

# ── Fixture key broker (evaluation only) ─────────────────────────────────────

- name: "space | Read the key broker token"
  kubernetes.core.k8s_info:
    kind: Secret
    name: space-key-broker-token
    namespace: "{{ space_namespace }}"
  register: _space_broker_token
  no_log: true

- name: "space | Install the fixture key broker"
  kubernetes.core.helm:
    name: space-key-broker
    chart_ref: "{{ space_src_dir }}/infra/space/kind/charts/space-kind-key-broker"
    release_namespace: "{{ space_namespace }}"
    values:
      image: {repository: "{{ space_image_prefix }}/space-kind-key-broker", tag: "{{ space_image_tag }}", pullPolicy: IfNotPresent}
      service: {name: "{{ space_key_broker_fixture_service }}", port: 50051}
      token:
        secretName: space-key-broker-fixture-token
        value: "{{ _space_broker_token.resources[0].data.token | b64decode }}"
    wait: true
    timeout: 5m0s
  no_log: true

- name: "space | Front the key broker with TLS"
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
    wait: true
  loop: "{{ lookup('template', 'key-broker-tls.yaml.j2') | from_yaml_all | select | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"

# ── SPACE ────────────────────────────────────────────────────────────────────

# The shim DNATs <sandbox pod IP>:9800 to node-api on the pod's own node. Upstream
# relies on pod-to-own-node traffic bypassing NetworkPolicy; Calico applies the
# sandbox egress policy to it, and its internetExcept covers the node addresses.
- name: "space | Let sandbox pods reach node-api on their node"
  vars:
    _node_ips: >-
      {{ _space_workers.resources | map(attribute='status.addresses') | flatten
         | selectattr('type', 'eq', 'InternalIP') | map(attribute='address') | list }}
    _node_peers: >-
      {%- set peers = [] -%}
      {%- for ip in _node_ips -%}{%- set _ = peers.append({'ipBlock': {'cidr': ip ~ '/32'}}) -%}{%- endfor -%}
      {{ peers }}
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: space-sandbox-to-node-api
        namespace: "{{ space_sandbox_namespace }}"
        labels: {app.kubernetes.io/part-of: space}
      spec:
        podSelector:
          matchLabels: {app.kubernetes.io/name: space-sandbox}
        policyTypes: [Egress]
        egress:
          - to: "{{ _node_peers }}"
            ports: [{protocol: TCP, port: 9800}]

- name: "space | Check for the platform gateway"
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: Gateway
    name: "{{ gateway_name | default('eg-gateway') }}"
    namespace: "{{ gateway_namespace | default('envoy-gateway-system') }}"
  register: _space_gateway
  when: space_public_enabled | bool or space_e2b_enabled | bool

# The API hands clients this data-plane origin for command streams and files
- name: "space | Decide whether to publish SPACE on the gateway"
  ansible.builtin.set_fact:
    _space_public: "{{ space_public_enabled | bool and (_space_gateway.resources | default([]) | length > 0) }}"
    _space_e2b: "{{ space_e2b_enabled | bool and (_space_gateway.resources | default([]) | length > 0) }}"

- name: "space | Render the install values"
  ansible.builtin.template:
    src: values.yaml.j2
    dest: "{{ space_values_file }}"
    mode: "0600"

- name: "space | Read the current kube context"
  ansible.builtin.command: kubectl config current-context
  register: _space_kube_context
  changed_when: false

# Checks its prerequisites, runs the migrate Job, then the space and space-builder releases
- name: "space | Run the upstream cluster install"
  ansible.builtin.command:
    cmd: >-
      bash infra/space/cluster/install.sh -f {{ space_values_file }}
      --kube-context {{ _space_kube_context.stdout }} --namespace {{ space_namespace }}
      --timeout {{ space_install_timeout }}
    chdir: "{{ space_src_dir }}"
  register: _space_install
  changed_when: true

- name: "space | Publish the API and data plane on the gateway"
  ansible.builtin.include_tasks: publish.yaml
  loop:
    - {name: space-api, host: "{{ space_api_hostname }}", service: space-api-entry, port: 8080,
       timeout: "{{ space_api_route_timeout }}", enabled: "{{ _space_public }}"}
    - {name: space-data-plane, host: "{{ space_data_plane_hostname }}", service: space-data-plane-entry, port: 8090,
       timeout: "{{ space_data_plane_route_timeout }}", enabled: "{{ _space_public }}"}
    # E2B SDK: management calls to api.<domain>, sandbox traffic to <port>-<id>.<domain>
    - {name: space-e2b-api, host: "{{ space_e2b_api_hostname }}", service: space-api-entry, port: 8080,
       timeout: "{{ space_api_route_timeout }}", enabled: "{{ _space_e2b }}", section: "{{ space_e2b_listener }}"}
    - {name: space-e2b-sandboxes, host: "*.{{ space_e2b_domain }}", service: space-data-plane-entry, port: 8090,
       timeout: "{{ space_data_plane_route_timeout }}", enabled: "{{ _space_e2b }}", section: "{{ space_e2b_listener }}"}
  loop_control:
    loop_var: space_route
    label: "{{ space_route.name }}"

# The E2B SDK sends headers with underscores (lang_version, sdk_runtime), which
# Envoy Gateway rejects by default. Allow them on the E2B listener only; a
# listener policy replaces the gateway one, so it keeps its ALPN.
- name: "space | Accept the E2B SDK's headers on the E2B listener"
  kubernetes.core.k8s:
    state: "{{ 'present' if _space_e2b | bool else 'absent' }}"
    definition:
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: ClientTrafficPolicy
      metadata:
        name: space-e2b-listener
        namespace: "{{ gateway_namespace | default('envoy-gateway-system') }}"
        labels: {app.kubernetes.io/part-of: space}
      spec:
        targetRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: "{{ gateway_name | default('eg-gateway') }}"
            sectionName: "{{ space_e2b_listener }}"
        tls:
          alpnProtocols: [h2, http/1.1]
        headers:
          withUnderscoresAction: Allow

- name: "space | Seed template and API key"
  ansible.builtin.include_tasks: seed.yaml

- name: "space | Deployment summary"
  ansible.builtin.debug:
    msg:
      - "============================================================"
      - "  SPACE {{ space_rev[:12] }} deployed (EVALUATION ONLY: fixture key broker)"
      - "  Namespaces : {{ space_namespace }} (control plane), {{ space_sandbox_namespace }} (sandboxes)"
      - "  Workers    : {{ _space_workers.resources | map(attribute='metadata.name') | join(', ') }}"
      - "  API        : {{ ('https://' ~ space_api_hostname) if _space_public | bool else 'svc/space-api-entry:8080 (in-cluster)' }}"
      - "  Data plane : {{ ('https://' ~ space_data_plane_hostname) if _space_public | bool else 'svc/space-data-plane-entry:8090 (in-cluster)' }}"
      - "  API key    : Secret space-api-key in {{ space_namespace }}"
      - "  Verify     : kubectl get pods -n {{ space_namespace }}; see docs/space.md"
      - "============================================================"
